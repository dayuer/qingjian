[package]
name = "qingjian-cloud-mac"
description = "青简 Cloud 的 Mac 菜单栏常驻程序：跨设备剪贴板"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "qingjian-cloud-mac"
path = "src/main.rs"

[dependencies]
qingjian-cloud-client = { workspace = true, features = ["native-tls"] }
qingjian-cloud-proto.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2.5"
toml_edit = "0.25"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSDate", "NSObject", "NSString", "NSTimer"] }
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSButton", "NSControl", "NSImage", "NSMenu", "NSMenuItem", "NSPasteboard", "NSResponder", "NSRunningApplication", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView"] }

[lints]
workspace = true
