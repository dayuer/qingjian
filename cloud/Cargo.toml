# 青简 Cloud 的独立 workspace：不加进根目录的 workspace，有自己的 Cargo.lock，与上游隔离（见 docs/design.md）。
[workspace]
resolver = "3"
members = [
    "crates/qingjian-cloud-proto",
    "crates/qingjian-cloud-client",
    "crates/qingjian-cloud-bridge",
    "crates/qingjian-cloud-mac",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
qingjian-cloud-proto = { path = "crates/qingjian-cloud-proto" }
qingjian-cloud-client = { path = "crates/qingjian-cloud-client", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tracing = "0.1.44"
toml = "1.1.5"
uuid = { version = "1.27", features = ["v4"] }
