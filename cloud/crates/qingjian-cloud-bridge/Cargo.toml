[package]
name = "qingjian-cloud-bridge"
description = "青简 Cloud 的 iOS 桥：把上游 Engine 包成 C ABI 静态库，给 Swift 写的键盘扩展调用"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
qingjian-core = { path = "../../../crates/qingjian-core" }
qingjian-dictionary = { path = "../../../crates/qingjian-dictionary" }
qingjian-learning = { path = "../../../crates/qingjian-learning" }
qingjian-lm = { path = "../../../crates/qingjian-lm" }
qingjian-predict = { path = "../../../crates/qingjian-predict" }
qingjian-platform = { path = "../../../crates/qingjian-platform" }
# iOS 用系统 TLS（Security.framework），不交叉编译 ring
qingjian-cloud-client = { workspace = true, features = ["native-tls"] }
qingjian-cloud-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit = "0.25"
tracing.workspace = true
uuid.workspace = true
getrandom = "0.4"

[lints]
workspace = true

