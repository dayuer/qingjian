[package]
name = "qingjian-cloud-mac"
description = "青简 Cloud 的 Mac 端：链进输入法进程，跨设备剪贴板与学习数据、设置、输入日志同步"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
qingjian-cloud-client = { workspace = true, features = ["native-tls"] }
qingjian-cloud-proto.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSDate", "NSObject", "NSRunLoop", "NSString", "NSTimer"] }
objc2-app-kit = { version = "0.3.2", features = ["NSPasteboard"] }

[lints]
workspace = true
