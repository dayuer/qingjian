# iOS 主 App + 键盘扩展的 xcodegen 工程描述；生成：`xcodegen generate`（.xcodeproj 不进仓库）。
# 主 App 与键盘靠 App Group（group.app.qingjian.cloud）共享设置，要自动签名：Xcode 登录团队 L9YRXEKYN2 的账号，
# 换团队改下面的 DEVELOPMENT_TEAM 或在 Xcode 里选。
name: QingjianCloud
options:
  bundleIdPrefix: app.qingjian.cloud
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: L9YRXEKYN2
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  QingjianCloud:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: Keyboard
      # 设置页与账号页用桥读写 config.toml / cloud.toml
      - framework: Frameworks/QingjianBridge.xcframework
        embed: false
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: [group.app.qingjian.cloud]
        # 账号页的「通过 Apple 登录」；服务端核对 identity_token 的 aud = app.qingjian.cloud
        com.apple.developer.applesignin: [Default]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 素笺
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.qingjian.cloud
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  Keyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard/Sources
      - path: Shared
      - path: Keyboard/Data
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Frameworks/QingjianBridge.xcframework
        embed: false
    entitlements:
      path: Keyboard/Keyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.app.qingjian.cloud]
    preBuildScripts:
      - name: 编译 Rust 桥与拷产品数据
        script: '"${PROJECT_DIR}/scripts/build-bridge.sh"'
        basedOnDependencyAnalysis: false
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: 素笺
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            # 完全访问用于按键震动（iOS 规定第三方键盘没有它不能震）、写 App Group 里的学习数据与连素笺云
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.qingjian.cloud.keyboard
        # 构建脚本要往源码目录写 xcframework 与数据
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  QingjianCloudTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - Keyboard/Sources/EngineDisplay.swift
      - Keyboard/Sources/CandidateItem.swift
    dependencies:
      - target: QingjianCloud
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.qingjian.cloud.tests
