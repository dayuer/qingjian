# 复制成 cloud.local.toml（不进仓库）填好，构建时会拷进键盘。没有这个文件键盘完全离线。
# 令牌每台设备一个，在服务器上生成：qingjian-cloud device add iphone

server = "https://pinyin.synon.ai"
token = ""

# 用服务器的大模型润色
llm = true

# 组字时让大模型补候选（缺省关：要等网络，准确率交给服务器上的纠错闭环）
candidates = false

# 记输入日志并上传，服务器上的纠错闭环靠它纠正词语、补热词、调词频
logs = true

# 与 Mac 等设备同步学习数据（词频、用户词、个人 n-gram 等）
sync = true
