[package]
name = "qingjian-cloud-tuner"
description = "青简 Cloud 的纠错闭环：从汇总的输入日志与学习数据找问题，大模型修正，回放把关后推回服务器"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "qingjian-cloud-tuner"
path = "src/main.rs"

[dependencies]
qingjian-cloud-client = { workspace = true, features = ["rustls"] }
qingjian-cloud-proto.workspace = true
# 只用它的音节表校验大模型给的拼音
qingjian-core = { path = "../../crates/qingjian-core" }
clap = { version = "4.6.7", features = ["derive", "env"] }
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ureq = { version = "3.4.2", features = ["json"] }

[dev-dependencies]
axum = "0.8.9"
qingjian-cloud-server = { path = "../server" }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net"] }

[lints]
workspace = true
